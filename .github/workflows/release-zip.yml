name: Build the claude.ai zip

# On every published release, zip the skill folder as on-brand.zip
# (folder name matches the skill name, as claude.ai requires) and attach it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the skill folder
        run: |
          cd plugins/on-brand/skills
          zip -r ../../../on-brand.zip on-brand -x "*.DS_Store"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" on-brand.zip --clobber
